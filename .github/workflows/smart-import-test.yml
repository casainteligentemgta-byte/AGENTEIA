name: SmartImport Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/smart-import/**"
      - ".github/workflows/smart-import-test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/smart-import/**"
      - ".github/workflows/smart-import-test.yml"

defaults:
  run:
    working-directory: packages/smart-import

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v4
        with:
          files: packages/smart-import/coverage/lcov.info
          flags: smart-import
        continue-on-error: true

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/smart-import/playwright-report/
          retention-days: 14

  security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npm run test:security

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npm run test:performance

  chaos-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npm run test:chaos

  contract-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npm run test:contract
      - run: npm run test:integration
