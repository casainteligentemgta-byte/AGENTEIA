# Alias CI — SmartImport (lint + unit + build)
name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/smart-import/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/smart-import/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: packages/smart-import

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/smart-import/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
