# Plantilla — NO subir secretos reales al repo.
# Crear en cluster con:
#   kubectl create secret generic smartimport-secrets \
#     --from-literal=SUPABASE_URL="<URL>" \
#     --from-literal=SUPABASE_ANON_KEY="<KEY>" \
#     --from-literal=DATABASE_URL="<URL>" \
#     --from-literal=REDIS_URL="redis://smartimport-redis:6379" \
#     -n production
#
# O aplicar este archivo tras reemplazar los placeholders (solo en entorno local).
apiVersion: v1
kind: Secret
metadata:
  name: smartimport-secrets
  namespace: production
type: Opaque
stringData:
  SUPABASE_URL: "https://YOUR_PROJECT.supabase.co"
  SUPABASE_ANON_KEY: "YOUR_ANON_KEY"
  DATABASE_URL: "postgresql://user:pass@host:5432/smartimport"
  REDIS_URL: "redis://smartimport-redis:6379"
