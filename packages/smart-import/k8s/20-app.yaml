apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartimport
  namespace: production
  labels:
    app: smartimport
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smartimport
  template:
    metadata:
      labels:
        app: smartimport
    spec:
      containers:
        - name: app
          image: ghcr.io/casainteligentemgta-byte/smartimport:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: smartimport-config
            - secretRef:
                name: smartimport-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smartimport
  namespace: production
spec:
  type: LoadBalancer
  selector:
    app: smartimport
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartimport
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartimport
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartimport
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: smartimport.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartimport
                port:
                  number: 80
  tls:
    - hosts:
        - smartimport.example.com
      secretName: smartimport-tls
