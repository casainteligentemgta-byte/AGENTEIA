apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartimport-redis
  namespace: production
  labels:
    app: smartimport-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartimport-redis
  template:
    metadata:
      labels:
        app: smartimport-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: smartimport-redis
  namespace: production
spec:
  selector:
    app: smartimport-redis
  ports:
    - port: 6379
      targetPort: redis
