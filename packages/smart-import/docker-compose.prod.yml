# Override producción: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# - App con límites de recursos y réplicas (scale)
# - Observabilidad sin puertos públicos
# - Imagen desde registry

services:
  app:
    image: ${SMARTIMPORT_IMAGE:-ghcr.io/casainteligentemgta-byte/smartimport:latest}
    build: null
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
        max_attempts: 5
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in prod}

  redis:
    ports: []

  prometheus:
    ports: []
    profiles: ["observability"]

  grafana:
    ports: []
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}

  jaeger:
    ports: []
    profiles: ["observability"]
